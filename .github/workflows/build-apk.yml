name: Build APK

on:
  push:
  workflow_dispatch:

# Lets the build publish the APK on the repo's "Releases" page
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Copy viewer page into the app
        run: python3 tools/build_web.py

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Facet-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Also put the APK on the Releases page, so it's a direct download (no zip)
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Facet-build-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Facet build ${{ github.run_number }}
          body: Built automatically from the latest code. Download the .apk below and open it on your phone.
          files: Facet-build-${{ github.run_number }}.apk
          make_latest: true
